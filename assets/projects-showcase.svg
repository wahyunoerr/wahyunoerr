    <text x="18" y="17.5" fill="#FCD34D" font-size="11" font-weight="600" letter-spacing="0.8" class="font-sans">PORTFOLIO WORK</text>
    <text x="0" y="64" fill="#FFFFFF" font-size="29" font-weight="700" class="font-display">Selected Production <tspan fill="url(#goldText)">Systems &amp; Platforms</tspan></text>
    <text x="1104" y="60" text-anchor="end" fill="#A1A1AA" font-size="13" font-weight="400" class="font-sans">Enterprise web applications built for logistics, healthcare, HR operations, and commerce.</text>
  </g>

  <!-- ROW 1 (Y = 132) -->
  <!-- Project 1: Wutama Logistics System -->
  <g transform="translate(48, 132)">
