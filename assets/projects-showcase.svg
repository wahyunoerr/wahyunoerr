  <rect width="1200" height="620" rx="22" fill="url(#bgSection)"/>
  <rect x="1" y="1" width="1198" height="618" rx="21" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.2"/>

