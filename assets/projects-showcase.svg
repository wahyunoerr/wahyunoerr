    <text x="20" y="98" fill="#A1A1AA" font-size="12.5" class="font-sans">
      <tspan x="20" dy="0">Complete shipping operations platform handling</tspan>
      <tspan x="20" dy="19">fleet tracking, supplier contracts, automated</tspan>
