      <rect x="70" y="0" width="58" height="24" rx="6" fill="#1F1F22"/><text x="82" y="16" fill="#E4E4E7" font-size="11" font-weight="500" class="font-sans">MySQL</text>
      <rect x="136" y="0" width="76" height="24" rx="6" fill="#1F1F22"/><text x="148" y="16" fill="#E4E4E7" font-size="11" font-weight="500" class="font-sans">Bootstrap</text>
      <rect x="220" y="0" width="88" height="24" rx="6" fill="#1F1F22"/><text x="232" y="16" fill="#E4E4E7" font-size="11" font-weight="500" class="font-sans">Excel Engine</text>
