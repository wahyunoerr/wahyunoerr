    <text x="332" y="36" text-anchor="end" fill="#34D399" font-size="11" font-weight="600" class="font-sans">60% Faster Billing</text>

    <text x="20" y="72" fill="#FFFFFF" font-size="19" font-weight="700" class="font-display">Sigalon &amp; Retail Inventory</text>
    <text x="20" y="98" fill="#A1A1AA" font-size="12.5" class="font-sans">
