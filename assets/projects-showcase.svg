      <rect x="70" y="0" width="92" height="24" rx="6" fill="#1F1F22"/><text x="82" y="16" fill="#E4E4E7" font-size="11" font-weight="500" class="font-sans">FullCalendar</text>
      <rect x="170" y="0" width="68" height="24" rx="6" fill="#1F1F22"/><text x="182" y="16" fill="#E4E4E7" font-size="11" font-weight="500" class="font-sans">Chart.js</text>
      <rect x="246" y="0" width="58" height="24" rx="6" fill="#1F1F22"/><text x="258" y="16" fill="#E4E4E7" font-size="11" font-weight="500" class="font-sans">MySQL</text>
    </g>
