<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="100%" height="100%">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ADD8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="accentRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Card 1: go-boost (Top Left) -->
  <g transform="translate(0, 0)">
    <rect width="588" height="222" rx="14" fill="url(#panelBg)" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="0" y="0" width="588" height="3" rx="1.5" fill="url(#accentCyan)"/>
    <text x="28" y="38" class="mono" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1.5">01 // FLAGSHIP OPEN-SOURCE &amp; MCP ENGINE</text>
    <text x="28" y="70" class="sans" font-size="22" font-weight="800" fill="#F8FAFC">go-boost (v2.4.1)</text>
    <rect x="448" y="48" width="112" height="24" rx="12" fill="#0C4A6E" stroke="#0284C7" stroke-width="1"/>
    <text x="504" y="64" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#7DD3FC">Pure Go AST</text>
    <text x="28" y="102" class="sans" font-size="13.5" fill="#94A3B8">21 native Model Context Protocol tools giving AI coding agents deterministic</text>
    <text x="28" y="122" class="sans" font-size="13.5" fill="#94A3B8">visibility into Go structs, implicit interfaces, HTTP routes, concurrency</text>
    <text x="28" y="142" class="sans" font-size="13.5" fill="#94A3B8">hazards, OpenAPI 3.0 specs, and read-only SQL schemas with zero dependencies.</text>
    <text x="28" y="188" class="mono" font-size="11.5" fill="#38BDF8">ast_inspect · concurrency_check · security_scan · schema_struct_diff · mock_generate</text>
  </g>

  <!-- Card 2: High-Concurrency Healthcare & Enterprise (Top Right) -->
  <g transform="translate(612, 0)">
    <rect width="588" height="222" rx="14" fill="url(#panelBg)" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="0" y="0" width="588" height="3" rx="1.5" fill="url(#accentRed)"/>
    <text x="28" y="38" class="mono" font-size="11" font-weight="700" fill="#F87171" letter-spacing="1.5">02 // HIGH-CONCURRENCY ENTERPRISE &amp; MEDICAL PLATFORMS</text>
    <text x="28" y="70" class="sans" font-size="22" font-weight="800" fill="#F8FAFC">Multi-Tenant Medical Check-Up &amp; HIS</text>
    <rect x="430" y="48" width="130" height="24" rx="12" fill="#450A0A" stroke="#DC2626" stroke-width="1"/>
    <text x="495" y="64" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#FCA5A5">Octane + Vue 3</text>
    <text x="28" y="102" class="sans" font-size="13.5" fill="#94A3B8">Production hospital &amp; corporate B2B portals engineered on Laravel 13, Octane</text>
    <text x="28" y="122" class="sans" font-size="13.5" fill="#94A3B8">(FrankenPHP), and Inertia Vue 3. Built with strict query-builder repositories,</text>
    <text x="28" y="142" class="sans" font-size="13.5" fill="#94A3B8">multi-tenant data isolation, SIMRS bridging, and Tilaka digital signatures.</text>
    <text x="28" y="188" class="mono" font-size="11.5" fill="#F87171">Laravel 13 · FrankenPHP · Inertia v3 · PostgreSQL/MySQL ·Pest 4 · PHPStan L7</text>
  </g>

  <!-- Card 3: Agentic Verification Doctrine (Bottom Left) -->
  <g transform="translate(0, 246)">
    <rect width="588" height="222" rx="14" fill="url(#panelBg)" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="0" y="0" width="588" height="3" rx="1.5" fill="url(#accentPurple)"/>
    <text x="28" y="38" class="mono" font-size="11" font-weight="700" fill="#C084FC" letter-spacing="1.5">03 // DETERMINISTIC AI &amp; VERIFICATION DOCTRINE</text>
    <text x="28" y="70" class="sans" font-size="22" font-weight="800" fill="#F8FAFC">agy-architect &amp; Automated Quality Gates</text>
    <rect x="434" y="48" width="126" height="24" rx="12" fill="#3B0764" stroke="#9333EA" stroke-width="1"/>
    <text x="497" y="64" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#D8B4FE">Zero-Hallucination</text>
    <text x="28" y="102" class="sans" font-size="13.5" fill="#94A3B8">Multi-agent orchestration framework enforcing machine-verified claims,</text>
    <text x="28" y="122" class="sans" font-size="13.5" fill="#94A3B8">cross-layer contract scanners (route-to-controller, closed-set UI inputs),</text>
    <text x="28" y="142" class="sans" font-size="13.5" fill="#94A3B8">peer-method symmetry checks, and P0 security gates before session completion.</text>
    <text x="28" y="188" class="mono" font-size="11.5" fill="#C084FC">Contract Verification · Red-First TDD · Peer Symmetry · Token Compression</text>
  </g>

  <!-- Card 4: Cross-Platform & Real-Time Operations (Bottom Right) -->
  <g transform="translate(612, 246)">
    <rect width="588" height="222" rx="14" fill="url(#panelBg)" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="0" y="0" width="588" height="3" rx="1.5" fill="url(#accentEmerald)"/>
    <text x="28" y="38" class="mono" font-size="11" font-weight="700" fill="#34D399" letter-spacing="1.5">04 // CROSS-PLATFORM &amp; BIOMETRIC EDGE SYSTEMS</text>
    <text x="28" y="70" class="sans" font-size="22" font-weight="800" fill="#F8FAFC">Biometric Attendance, OKR &amp; Field Ops</text>
    <rect x="438" y="48" width="122" height="24" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="499" y="64" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#6EE7B7">Flutter + Go + PHP</text>
    <text x="28" y="102" class="sans" font-size="13.5" fill="#94A3B8">End-to-end operational platforms: hospital fingerprint attendance engines,</text>
    <text x="28" y="122" class="sans" font-size="13.5" fill="#94A3B8">real-time service queue displays, OKR performance tracking (Mudahin-OKR),</text>
    <text x="28" y="142" class="sans" font-size="13.5" fill="#94A3B8">and cross-platform mobile clients engineered with Flutter &amp; Dart.</text>
    <text x="28" y="188" class="mono" font-size="11.5" fill="#34D399">Flutter · Dart · Biometric Sync · Real-Time Queue · Clean Architecture</text>
  </g>
</svg>