<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="100%" height="100%">
  <defs>
    <style>
      .font-display { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(1.5); }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes floatBadge {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(4px); }
      }
      @keyframes drawLine {
        0% { stroke-dashoffset: 380; }
        50% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 380; }
      }
      .pulse-ring { animation: pulseDot 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .float-main { animation: floatCard 6s ease-in-out infinite; }
      .float-sub { animation: floatBadge 5s ease-in-out infinite; }
      .chart-line { stroke-dasharray: 380; animation: drawLine 10s ease-in-out infinite; }
    </style>

    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="55%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D4A574"/>
    </linearGradient>

    <linearGradient id="goldSubtle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A574" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#D4A574" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0.24"/>
    </linearGradient>

    <linearGradient id="chartFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4A574" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#D4A574" stop-opacity="0.0"/>
    </linearGradient>

    <radialGradient id="ambientLeft" cx="18%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#D4A574" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambientRight" cx="80%" cy="55%" r="42%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="430" rx="22" fill="url(#bgCanvas)"/>
  <rect width="1200" height="430" rx="22" fill="url(#ambientLeft)"/>
  <rect width="1200" height="430" rx="22" fill="url(#ambientRight)"/>
  <rect width="1200" height="430" rx="22" fill="url(#dotGrid)"/>
  <rect x="1" y="1" width="1198" height="428" rx="21" fill="none" stroke="url(#goldSubtle)" stroke-width="1.5"/>

  <!-- Left Column: Identity & Value Proposition -->
  <g transform="translate(52, 48)">
    <!-- Availability Pill -->
    <rect x="0" y="0" width="246" height="32" rx="16" fill="#D4A574" fill-opacity="0.1" stroke="#D4A574" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="18" cy="16" r="5" fill="#D4A574" class="pulse-ring"/>
    <circle cx="18" cy="16" r="3.5" fill="#FCD34D"/>
    <text x="34" y="20.5" fill="#E7C69E" font-size="12" font-weight="600" letter-spacing="0.4" class="font-sans">Open to Work &amp; Collaboration</text>

    <!-- Main Heading -->
    <text x="0" y="86" fill="#FFFFFF" font-size="48" font-weight="800" letter-spacing="-0.6" class="font-display">Wahyu Nur</text>
    <text x="0" y="134" fill="url(#goldGrad)" font-size="36" font-weight="700" letter-spacing="-0.3" class="font-display">Full Stack Web Developer</text>

    <!-- Bio Paragraph (Zero Hyphens or Dashes) -->
    <text x="0" y="176" fill="#A1A1AA" font-size="15" font-weight="400" class="font-sans">
      <tspan x="0" dy="0">Building scalable enterprise web applications, logistics &amp; HR platforms,</tspan>
      <tspan x="0" dy="24">and modern digital business systems with</tspan>
      <tspan fill="#FFFFFF" font-weight="600"> Laravel</tspan><tspan fill="#A1A1AA">,</tspan>
      <tspan fill="#FFFFFF" font-weight="600"> Vue.js</tspan><tspan fill="#A1A1AA">, and</tspan>
      <tspan fill="#FFFFFF" font-weight="600"> Go</tspan><tspan fill="#A1A1AA">.</tspan>
      <tspan x="0" dy="24">Focused on clean architecture, reliability, and measurable business value.</tspan>
    </text>

    <!-- 3 Key Highlights Row (Generous Widths: 196px each) -->
    <g transform="translate(0, 258)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="194" height="74" rx="14" fill="#141414" fill-opacity="0.95" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
      <rect x="14" y="18" width="38" height="38" rx="10" fill="#D4A574" fill-opacity="0.14"/>
      <path d="M27 37 L31 41 L40 31" fill="none" stroke="#FCD34D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="64" y="34" fill="#FFFFFF" font-size="17" font-weight="700" class="font-display">3+ Years</text>
      <text x="64" y="52" fill="#A1A1AA" font-size="11" font-weight="500" class="font-sans">Production Experience</text>

      <!-- Card 2 -->
      <rect x="206" y="0" width="194" height="74" rx="14" fill="#141414" fill-opacity="0.95" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
      <rect x="220" y="18" width="38" height="38" rx="10" fill="#D4A574" fill-opacity="0.14"/>
      <path d="M232 31 H246 M232 37 H246 M232 43 H241" fill="none" stroke="#FCD34D" stroke-width="2" stroke-linecap="round"/>
      <text x="270" y="34" fill="#FFFFFF" font-size="17" font-weight="700" class="font-display">10+ Systems</text>
      <text x="270" y="52" fill="#A1A1AA" font-size="11" font-weight="500" class="font-sans">Delivered to Clients</text>

      <!-- Card 3 -->
      <rect x="412" y="0" width="194" height="74" rx="14" fill="#141414" fill-opacity="0.95" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
      <rect x="426" y="18" width="38" height="38" rx="10" fill="#D4A574" fill-opacity="0.14"/>
      <circle cx="445" cy="37" r="7" fill="none" stroke="#FCD34D" stroke-width="2"/>
      <circle cx="445" cy="37" r="2" fill="#FCD34D"/>
      <text x="476" y="34" fill="#FFFFFF" font-size="17" font-weight="700" class="font-display">Pekanbaru, ID</text>
      <text x="476" y="52" fill="#A1A1AA" font-size="11" font-weight="500" class="font-sans">Remote &amp; Onsite</text>
    </g>
  </g>

  <!-- Right Column: Interactive Layered Product Architecture Preview -->
  <g transform="translate(696, 40)">
    <rect x="16" y="18" width="420" height="310" rx="24" fill="#D4A574" fill-opacity="0.05"/>

    <!-- Main Floating Application Window -->
    <g class="float-main">
      <rect x="0" y="8" width="452" height="292" rx="18" fill="#141414" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.2"/>

      <!-- Window Header Bar -->
      <rect x="0" y="8" width="452" height="40" rx="18" fill="#1A1A1A"/>
      <rect x="0" y="34" width="452" height="14" fill="#1A1A1A"/>
      <line x1="0" y1="48" x2="452" y2="48" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>
      <circle cx="22" cy="28" r="5" fill="#3F3F46"/>
      <circle cx="38" cy="28" r="5" fill="#3F3F46"/>
      <circle cx="54" cy="28" r="5" fill="#D4A574"/>
      <text x="74" y="32.5" fill="#E4E4E7" font-size="11.5" font-weight="600" class="font-sans">Enterprise System Overview</text>
      <rect x="352" y="18" width="82" height="20" rx="10" fill="#D4A574" fill-opacity="0.16"/>
      <text x="366" y="31.5" fill="#FCD34D" font-size="10.5" font-weight="600" class="font-sans">Production</text>

      <!-- Mini KPI Row inside Preview -->
      <rect x="20" y="64" width="130" height="60" rx="10" fill="#0F0F0F" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <text x="32" y="84" fill="#71717A" font-size="10.5" font-weight="500" class="font-sans">Rent &amp; Billing Rate</text>
      <text x="32" y="109" fill="#FFFFFF" font-size="17.5" font-weight="700" class="font-display">98.0%</text>
      <text x="92" y="108" fill="#34D399" font-size="10.5" font-weight="600" class="font-sans">Verified</text>

      <rect x="161" y="64" width="130" height="60" rx="10" fill="#0F0F0F" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <text x="173" y="84" fill="#71717A" font-size="10.5" font-weight="500" class="font-sans">Active Catalog</text>
      <text x="173" y="109" fill="#FFFFFF" font-size="17.5" font-weight="700" class="font-display">500+ SKU</text>

      <rect x="302" y="64" width="130" height="60" rx="10" fill="#0F0F0F" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <text x="314" y="84" fill="#71717A" font-size="10.5" font-weight="500" class="font-sans">Conflict Reduction</text>
      <text x="314" y="109" fill="#FCD34D" font-size="17.5" font-weight="700" class="font-display">95.0%</text>

      <!-- Animated Performance & Operations Chart Area -->
      <rect x="20" y="138" width="412" height="142" rx="12" fill="#0F0F0F" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <text x="36" y="162" fill="#E4E4E7" font-size="11.5" font-weight="600" class="font-sans">Live Operations &amp; Platform Throughput</text>
      <text x="346" y="162" fill="#D4A574" font-size="10.5" font-weight="600" class="font-sans">Active Metrics</text>

      <!-- Grid Lines -->
      <line x1="36" y1="184" x2="412" y2="184" stroke="#FFFFFF" stroke-opacity="0.04" stroke-dasharray="3 3"/>
      <line x1="36" y1="216" x2="412" y2="216" stroke="#FFFFFF" stroke-opacity="0.04" stroke-dasharray="3 3"/>
      <line x1="36" y1="248" x2="412" y2="248" stroke="#FFFFFF" stroke-opacity="0.04" stroke-dasharray="3 3"/>

      <!-- Area & Animated Gold Curve -->
      <path d="M36 248 C85 240, 120 206, 168 212 C214 218, 250 180, 300 186 C345 190, 378 168, 412 172 L412 262 L36 262 Z" fill="url(#chartFill)"/>
      <path d="M36 248 C85 240, 120 206, 168 212 C214 218, 250 180, 300 186 C345 190, 378 168, 412 172" fill="none" stroke="url(#goldGrad)" stroke-width="2.8" stroke-linecap="round" class="chart-line"/>

      <circle cx="168" cy="212" r="4" fill="#141414" stroke="#FCD34D" stroke-width="2.2"/>
      <circle cx="300" cy="186" r="4" fill="#141414" stroke="#FCD34D" stroke-width="2.2"/>
      <circle cx="412" cy="172" r="4.5" fill="#FCD34D"/>
    </g>

    <!-- Floating Bottom Overlay Pill (Nested <g> so translate(32, 306) is preserved!) -->
    <g transform="translate(32, 306)">
      <g class="float-sub">
        <rect x="0" y="0" width="388" height="44" rx="14" fill="#1A1A1D" stroke="#D4A574" stroke-opacity="0.42" stroke-width="1.2"/>
        <circle cx="24" cy="22" r="8" fill="#D4A574" fill-opacity="0.2"/>
        <circle cx="24" cy="22" r="3.5" fill="#FCD34D"/>
        <text x="44" y="26.5" fill="#FFFFFF" font-size="12" font-weight="600" class="font-sans">Core Stack: <tspan fill="#E7C69E" font-weight="500">Laravel · Filament · Vue.js · Livewire · Go</tspan></text>
      </g>
    </g>
  </g>
</svg>