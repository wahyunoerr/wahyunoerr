<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <style>
      .font-display { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.95; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(1.55); }
      }
      @keyframes floatBack {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes floatFront {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(4px); }
      }
      @keyframes packetMove {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .pulse-dot { animation: pulseGlow 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .win-back { animation: floatBack 6.5s ease-in-out infinite; }
      .win-front { animation: floatFront 5.5s ease-in-out infinite; }
      .data-stream { stroke-dasharray: 10 14; animation: packetMove 6s linear infinite; }
      .cursor-blink { animation: blinkCursor 1.1s step-end infinite; }
    </style>

    <linearGradient id="bgMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709"/>
      <stop offset="50%" stop-color="#0F1015"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>

    <linearGradient id="goldLux" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D4A574"/>
    </linearGradient>

    <linearGradient id="cyanLux" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ADD8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="borderDual" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A574" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00ADD8" stop-opacity="0.38"/>
    </linearGradient>

    <linearGradient id="areaGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0.0"/>
    </linearGradient>

    <radialGradient id="glowGold" cx="18%" cy="24%" r="48%">
      <stop offset="0%" stop-color="#D4A574" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#070709" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="84%" cy="68%" r="46%">
      <stop offset="0%" stop-color="#00ADD8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#070709" stop-opacity="0"/>
    </radialGradient>

    <pattern id="archGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.03"/>
      <circle cx="32" cy="32" r="1" fill="#D4A574" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="440" rx="22" fill="url(#bgMain)"/>
  <rect width="1200" height="440" rx="22" fill="url(#glowGold)"/>
  <rect width="1200" height="440" rx="22" fill="url(#glowCyan)"/>
  <rect width="1200" height="440" rx="22" fill="url(#archGrid)"/>
  <rect x="1" y="1" width="1198" height="438" rx="21" fill="none" stroke="url(#borderDual)" stroke-width="1.5"/>

  <!-- Top Subtle Light Accent Bar -->
  <rect x="48" y="1" width="260" height="2" fill="url(#goldLux)"/>
  <rect x="892" y="1" width="260" height="2" fill="url(#cyanLux)"/>

  <!-- LEFT COLUMN: EXECUTIVE IDENTITY & METRICS -->
  <g transform="translate(52, 48)">
    <!-- Status Badge -->
    <rect x="0" y="0" width="356" height="32" rx="16" fill="#131419" stroke="#D4A574" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="18" cy="16" r="5" fill="#D4A574" class="pulse-dot"/>
    <circle cx="18" cy="16" r="3" fill="#FCD34D"/>
    <text x="34" y="20.5" fill="#F3E3CE" font-size="11.5" font-weight="600" letter-spacing="0.5" class="font-sans">FULL STACK ARCHITECT &amp; OPEN SOURCE CREATOR</text>

    <!-- Name & Headline -->
    <text x="0" y="88" fill="#FFFFFF" font-size="50" font-weight="800" letter-spacing="-0.8" class="font-display">Wahyu Nur</text>
    <text x="0" y="134" fill="url(#goldLux)" font-size="31" font-weight="700" class="font-display">Enterprise Web &amp; AI Systems Engineer</text>

    <!-- Bio Description -->
    <text x="0" y="176" fill="#A1A1AA" font-size="14.5" font-weight="400" class="font-sans">
      <tspan x="0" dy="0">Creator of</tspan>
      <tspan fill="#38BDF8" font-weight="700"> Go Boost </tspan>
      <tspan fill="#A1A1AA">(21 native MCP tools for Go) and lead engineer behind</tspan>
      <tspan x="0" dy="24">10+ production platforms across logistics, hospital clinical workflows,</tspan>
      <tspan x="0" dy="24">workforce geofencing, and digital commerce using</tspan>
      <tspan fill="#FFFFFF" font-weight="600"> Laravel</tspan><tspan fill="#A1A1AA">,</tspan>
      <tspan fill="#FFFFFF" font-weight="600"> Vue.js</tspan><tspan fill="#A1A1AA">, and</tspan>
      <tspan fill="#FFFFFF" font-weight="600"> Go</tspan><tspan fill="#A1A1AA">.</tspan>
    </text>

    <!-- 4 High-Density Metric Cards -->
    <g transform="translate(0, 258)">
      <!-- Metric 1: Flagship Open Source -->
      <rect x="0" y="0" width="138" height="86" rx="14" fill="#121318" stroke="#00ADD8" stroke-opacity="0.35" stroke-width="1.2"/>
      <rect x="16" y="0" width="54" height="2" fill="url(#cyanLux)"/>
      <text x="16" y="28" fill="#38BDF8" font-size="10.5" font-weight="700" letter-spacing="0.5" class="font-sans">GO BOOST MCP</text>
      <text x="16" y="56" fill="#FFFFFF" font-size="22" font-weight="800" class="font-display">21 Tools</text>
      <text x="16" y="74" fill="#94A3B8" font-size="11" font-weight="500" class="font-sans">v2.4.1 on pkg.go.dev</text>

      <!-- Metric 2: Engine Speed -->
      <rect x="148" y="0" width="138" height="86" rx="14" fill="#121318" stroke="#00ADD8" stroke-opacity="0.22" stroke-width="1"/>
      <text x="164" y="28" fill="#38BDF8" font-size="10.5" font-weight="700" letter-spacing="0.5" class="font-sans">COLD STARTUP</text>
      <text x="164" y="56" fill="#FFFFFF" font-size="22" font-weight="800" class="font-display">3.9 ms</text>
      <text x="164" y="74" fill="#94A3B8" font-size="11" font-weight="500" class="font-sans">Zero External Deps</text>

      <!-- Metric 3: Enterprise Systems -->
      <rect x="296" y="0" width="138" height="86" rx="14" fill="#121318" stroke="#D4A574" stroke-opacity="0.35" stroke-width="1.2"/>
      <rect x="312" y="0" width="54" height="2" fill="url(#goldLux)"/>
      <text x="312" y="28" fill="#FCD34D" font-size="10.5" font-weight="700" letter-spacing="0.5" class="font-sans">PRODUCTION</text>
      <text x="312" y="56" fill="#FFFFFF" font-size="22" font-weight="800" class="font-display">10+ Apps</text>
      <text x="312" y="74" fill="#94A3B8" font-size="11" font-weight="500" class="font-sans">Enterprise &amp; ERP</text>

      <!-- Metric 4: Track Record -->
      <rect x="444" y="0" width="138" height="86" rx="14" fill="#121318" stroke="#D4A574" stroke-opacity="0.22" stroke-width="1"/>
      <text x="460" y="28" fill="#FCD34D" font-size="10.5" font-weight="700" letter-spacing="0.5" class="font-sans">EXPERIENCE</text>
      <text x="460" y="56" fill="#FFFFFF" font-size="22" font-weight="800" class="font-display">3+ Years</text>
      <text x="460" y="74" fill="#94A3B8" font-size="11" font-weight="500" class="font-sans">Pekanbaru, ID</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: 3D LAYERED DUAL-WINDOW ARCHITECTURE SHOWCASE -->
  <!-- Back Window: Enterprise Production Telemetry (Gold Theme) -->
  <g transform="translate(684, 30)">
    <g class="win-back">
      <rect x="0" y="0" width="464" height="218" rx="16" fill="#121318" stroke="#D4A574" stroke-opacity="0.32" stroke-width="1.2"/>
      <rect x="0" y="0" width="464" height="36" rx="16" fill="#181920"/>
      <rect x="0" y="24" width="464" height="12" fill="#181920"/>
      <line x1="0" y1="36" x2="464" y2="36" stroke="#FFFFFF" stroke-opacity="0.07"/>
      <circle cx="20" cy="18" r="4.5" fill="#EF4444" fill-opacity="0.8"/>
      <circle cx="34" cy="18" r="4.5" fill="#F59E0B" fill-opacity="0.8"/>
      <circle cx="48" cy="18" r="4.5" fill="#10B981" fill-opacity="0.8"/>
      <text x="68" y="22" fill="#E4E4E7" font-size="11.5" font-weight="600" class="font-sans">Enterprise Production Telemetry</text>
      <rect x="378" y="9" width="70" height="18" rx="9" fill="#D4A574" fill-opacity="0.18"/>
      <text x="413" y="21.5" text-anchor="middle" fill="#FCD34D" font-size="9.5" font-weight="700" class="font-sans">LIVE PROD</text>

      <!-- Mini KPI Pills -->
      <rect x="18" y="48" width="134" height="52" rx="10" fill="#0B0C10" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <text x="30" y="66" fill="#94A3B8" font-size="10" font-weight="500" class="font-sans">Logistics &amp; Billing</text>
      <text x="30" y="88" fill="#FFFFFF" font-size="16" font-weight="700" class="font-display">98.0% Rate</text>

      <rect x="165" y="48" width="134" height="52" rx="10" fill="#0B0C10" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <text x="177" y="66" fill="#94A3B8" font-size="10" font-weight="500" class="font-sans">Cooperative ERP</text>
      <text x="177" y="88" fill="#FCD34D" font-size="16" font-weight="700" class="font-display">500+ SKUs</text>

      <rect x="312" y="48" width="134" height="52" rx="10" fill="#0B0C10" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <text x="324" y="66" fill="#94A3B8" font-size="10" font-weight="500" class="font-sans">Booking Conflicts</text>
      <text x="324" y="88" fill="#34D399" font-size="16" font-weight="700" class="font-display">95% Reduced</text>

      <!-- Mini Gold Area Curve -->
      <path d="M24 170 C80 162, 125 134, 175 140 C225 146, 270 116, 325 122 C375 126, 410 108, 440 112 L440 190 L24 190 Z" fill="url(#areaGold)"/>
      <path d="M24 170 C80 162, 125 134, 175 140 C225 146, 270 116, 325 122 C375 126, 410 108, 440 112" fill="none" stroke="url(#goldLux)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="175" cy="140" r="3.5" fill="#121318" stroke="#FCD34D" stroke-width="2"/>
      <circle cx="325" cy="122" r="3.5" fill="#121318" stroke="#FCD34D" stroke-width="2"/>
      <circle cx="440" cy="112" r="4" fill="#FCD34D"/>
    </g>
  </g>

  <!-- Front Overlapping Window: Go-Boost Native MCP & AST Engine -->
  <g transform="translate(656, 188)">
    <g class="win-front">
      <rect x="-4" y="-4" width="500" height="232" rx="20" fill="#000000" fill-opacity="0.58"/>
      <rect x="0" y="0" width="492" height="224" rx="16" fill="#0D1117" stroke="#00ADD8" stroke-opacity="0.55" stroke-width="1.4"/>

      <!-- Terminal Header -->
      <rect x="0" y="0" width="492" height="36" rx="16" fill="#161B22"/>
      <rect x="0" y="24" width="492" height="12" fill="#161B22"/>
      <line x1="0" y1="36" x2="492" y2="36" stroke="#30363D" stroke-width="1"/>
      <circle cx="20" cy="18" r="4.5" fill="#38BDF8"/>
      <text x="36" y="22" fill="#F0F6FC" font-size="11.5" font-weight="700" class="font-mono">go-boost mcp</text>
      <text x="132" y="22" fill="#8B949E" font-size="11" font-weight="500" class="font-sans">Flagship Open Source Go AI Suite</text>
      <rect x="386" y="8" width="92" height="20" rx="10" fill="#00ADD8" fill-opacity="0.18" stroke="#00ADD8" stroke-opacity="0.4"/>
      <text x="432" y="21.5" text-anchor="middle" fill="#38BDF8" font-size="10" font-weight="700" class="font-mono">v2.4.1 STDIO</text>

      <!-- Terminal Command Output (Fits cleanly inside 492px width) -->
      <text x="20" y="62" fill="#38BDF8" font-size="11" font-weight="700" class="font-mono">$</text>
      <text x="34" y="62" fill="#E6EDF3" font-size="11" font-weight="500" class="font-mono">go get github.com/wahyunoerr/go-boost/v2/cmd/go-boost@latest</text>

      <text x="20" y="86" fill="#34D399" font-size="11" font-weight="600" class="font-mono">[OK]</text>
      <text x="54" y="86" fill="#C9D1D9" font-size="11" class="font-mono">21 Native MCP Tools ready (3.9 ms boot, 0 external deps)</text>

      <text x="20" y="108" fill="#FCD34D" font-size="11" font-weight="600" class="font-mono">[AST]</text>
      <text x="58" y="108" fill="#8B949E" font-size="11" class="font-mono">ast_inspect · concurrency_check · security_scan · db_schema</text>
      <rect x="454" y="97" width="7" height="13" fill="#38BDF8" class="cursor-blink"/>

      <!-- Animated Neural/AST Circuitry Diagram inside Window -->
      <rect x="20" y="126" width="452" height="80" rx="12" fill="#090D13" stroke="#30363D" stroke-width="1"/>

      <!-- Node 1: AI Agents -->
      <rect x="34" y="142" width="118" height="48" rx="9" fill="#161B22" stroke="#D4A574" stroke-opacity="0.45"/>
      <text x="93" y="162" text-anchor="middle" fill="#FCD34D" font-size="10.5" font-weight="700" class="font-sans">AI CODING AGENTS</text>
      <text x="93" y="178" text-anchor="middle" fill="#8B949E" font-size="9.5" class="font-sans">Claude · Cursor · AGY</text>

      <!-- Animated Wire 1 -->
      <line x1="152" y1="166" x2="196" y2="166" stroke="#30363D" stroke-width="2"/>
      <line x1="152" y1="166" x2="196" y2="166" stroke="#38BDF8" stroke-width="2" class="data-stream"/>

      <!-- Node 2: Go Boost Core -->
      <rect x="196" y="142" width="108" height="48" rx="9" fill="#0C2333" stroke="#00ADD8" stroke-width="1.2"/>
      <text x="250" y="162" text-anchor="middle" fill="#38BDF8" font-size="10.5" font-weight="800" class="font-mono">GO BOOST</text>
      <text x="250" y="178" text-anchor="middle" fill="#E6EDF3" font-size="9.5" class="font-sans">JSON RPC 2.0</text>

      <!-- Animated Wire 2 -->
      <line x1="304" y1="166" x2="348" y2="166" stroke="#30363D" stroke-width="2"/>
      <line x1="304" y1="166" x2="348" y2="166" stroke="#FCD34D" stroke-width="2" class="data-stream"/>

      <!-- Node 3: Go Stdlib AST & DB -->
      <rect x="348" y="142" width="110" height="48" rx="9" fill="#161B22" stroke="#34D399" stroke-opacity="0.45"/>
      <text x="403" y="162" text-anchor="middle" fill="#34D399" font-size="10.5" font-weight="700" class="font-sans">AST &amp; SCHEMA</text>
      <text x="403" y="178" text-anchor="middle" fill="#8B949E" font-size="9.5" class="font-sans">Race · SQL · Mocks</text>
    </g>
  </g>
</svg>